const BLOBS = Array.from({ length: 5 }, (_, i) => ({ x: rand(), y: rand(), r: .45 + rand() * .4, sp: .05 + rand() * .08, ph: rand() * TAU, c: [C.elec, '#1446b8', C.cyan, '#0d3d99', '#2a6dff'][i] }));

const DUST = Array.from({ length: 80 }, () => ({ x: rand() * W, y: rand() * H, s: .5 + rand() * 2.2, v: 15 + rand() * 50, ph: rand() * TAU }));
function dust(g, t, a = 1) {

}
function vignette(g) {

  v.addColorStop(0, 'rgba(2,6,20,0)'); v.addColorStop(1, 'rgba(2,6,20,.7)'); g.fillStyle = v; g.fillRect(0, 0, W, H);

function streaks(g, t, a, seed = 0) {

  stride: { lean: .28, arch: .05, neck: .05, shN: -.95, elN: 1.55, shF: 1.05, elF: 1.4, hipN: 1.3, knN: -1.4, hipF: -.6, knF: -.55, ftN: .2, ftF: .6, lift: .06 },
  walk:   { lean: .06, arch: .02, neck: .04, shN: .35, elN: .45, shF: -.3, elF: .3, hipN: .38, knN: -.3, hipF: -.28, knF: -.4, ftN: 0, ftF: .2, lift: 0 },
  back:   { lean: .16, arch: -.12, neck: .12, shN: .2, elN: .4, shF: -.75, elF: 1.9, hipN: .12, knN: -.15, hipF: -.04, knF: -.1, ftN: 0, ftF: 0, lift: 0 },
  reachf: { lean: .04, arch: .08, neck: -.05, shN: 1.55, elN: .08, shF: .05, elF: .35, hipN: .06, knN: -.06, hipF: -.1, knF: -.08, ftN: 0, ftF: 0, lift: 0 },
  stretch:{ lean: -.08, arch: .38, neck: -.25, shN: 2.75, elN: .08, shF: 2.55, elF: .12, hipN: .04, knN: -.04, hipF: -.5, knF: -.15, ftN: 0, ftF: .3, lift: 0 },

const PK = Object.keys(POSES.stand);
const SVC_POSES = ['stand', 'stride', 'walk', 'back', 'reachf', 'stretch'];
const POSE_KEYS = [];
SVC_POSES.forEach((p, i) => { POSE_KEYS.push([6 + i + .2, PK.map(k => POSES[p][k])]); POSE_KEYS.push([6 + i + .78, PK.map(k => POSES[p][k])]); });
function spline(keys, t) {
  const n = keys.length; if (t <= keys[0][0]) return keys[0][1]; if (t >= keys[n - 1][0]) return keys[n - 1][1];
  let i = 0; while (keys[i + 1][0] < t) i++;

const FIG = { hb: 720, gx: W / 2, gy: 0 };
const L = { torso: .30, neck: .045, head: .068, ua: .165, fa: .15, hand: .065, th: .245, sh: .245, ft: .09 };
const dirD = a => ({ x: Math.sin(a), y: Math.cos(a) });

const NOTIF = [

  font(g, 500, 28); g.fillStyle = rgba(C.white, .55); g.textAlign = 'right'; g.fillText('sekarang', x + w - 34, y + h / 2 - 12);
  g.textAlign = 'left'; font(g, 500, 34); g.fillStyle = rgba(C.white, .88); g.fillText(msg, ix + 112, y + h / 2 + 34);

}
function drawLock(g, t) {

  if (kind === 'chart') { [-22, 0, 22].forEach((bx, i) => { g.fillRect(bx - 7, 30 - (i + 1) * 20, 14, (i + 1) * 20); }); g.beginPath(); g.moveTo(-32, 0); g.lineTo(-8, -20); g.lineTo(8, -8); g.lineTo(32, -34); g.stroke(); }
  if (kind === 'tag') { g.beginPath(); g.moveTo(-34, -10); g.lineTo(-10, -34); g.lineTo(32, -34); g.lineTo(32, 8); g.lineTo(8, 32); g.closePath(); g.stroke(); g.beginPath(); g.arc(16, -18, 6, 0, TAU); g.fill(); }

}
function sceneWhy(g, t) {
  const out = eIn(prog(t, 16.3, 16.5));

  font(g, 900, 100); g.fillStyle = C.white; maskUp(g, 'Ditangani', W / 2, 500, 100, 14.05, .015, t); maskUp(g, 'dengan benar.', W / 2, 610, 100, 14.15, .015, t);
  BADGES.forEach(([title, sub, ic], i) => {
    const t0 = 14.3 + i * .5, k = eExpo(prog(t, t0, t0 + .5)), bx = 90, bw = W - 180, bh = 210, by = 720 + i * 245;
    if (k <= 0) return;
    g.save(); g.translate(W / 2, by + bh / 2); g.transform(1, 0, 0, Math.max(.001, k), 0, 0); g.translate(-W / 2, -(by + bh / 2)); g.translate(0, (1 - k) * 160);

    g.fillStyle = ig; g.beginPath(); g.arc(bx + 110, by + bh / 2, 62, 0, TAU); g.fill();

    font(g, 500, 36); g.fillStyle = rgba(C.white, .7); g.fillText(sub, bx + 210, by + 150);

// ---------- S6 "Kapan bisa datang?" ----------
function sceneWhen(g, t) {
  const out = eIn(prog(t, 17.35, 17.5));

    const k = eExpo(prog(t, t0, t0 + .22)); if (k <= 0) return;

// ---------- S7 open every day ----------
const DAYS = ['SEN', 'SEL', 'RAB', 'KAM', 'JUM', 'SAB', 'MIN'];
function sceneOpen(g, t) {
  const out = eIn(prog(t, 20.8, 21.0));
  g.save(); g.globalAlpha = 1 - out; g.translate(0, -out * 140);
  const bk = eExpo(prog(t, 17.5, 17.85)), bs = lerp(1.7, 1, bk);
  g.save(); g.translate(W / 2, 560); g.scale(bs, bs); g.globalAlpha *= bk; if (bk < .95) g.filter = `blur(${(1 - bk) * 20}px)`;
  font(g, 900, 330); g.textAlign = 'center'; g.fillStyle = C.white; g.fillText('BUKA', 0, 0); g.restore();
  g.textAlign = 'left';
  font(g, 900, 120); g.fillStyle = gradText(g, W * .1, W * .9, C.elec, C.cyan);
  maskUp(g, 'SETIAP HARI', W / 2, 700, 120, 17.7, .025, t, .45, 4);
  // day tiles light up on 8th notes
  const tw = 122, gap = 12, x0 = (W - (7 * tw + 6 * gap)) / 2, ty = 800, th = 160;
  DAYS.forEach((d, i) => {
    const appear = eBack(prog(t, 17.85 + i * .03, 18.2 + i * .03)), lit = eOut(prog(t, 18.25 + i * .25, 18.45 + i * .25));
    if (appear <= 0) return;

    if (lit > 0) {
      g.save(); g.shadowColor = rgba(C.cyan, .8 * lit); g.shadowBlur = 40 * lit;
      const lg = g.createLinearGradient(x, y, x, y + th); lg.addColorStop(0, rgba(C.cyan, lit)); lg.addColorStop(1, rgba(C.elec, lit));
      rr(g, x, y - lit * 12, tw, th, 28); g.fillStyle = lg; g.fill(); g.restore();
    }
    glass(g, x, y - lit * 12, tw, th, 28, 1 - lit * .5);
    font(g, 800, 34); g.fillStyle = C.white; g.textAlign = 'center'; g.fillText(d, x + tw / 2, y - lit * 12 + 72);
    g.beginPath(); g.arc(x + tw / 2, y - lit * 12 + 115, 9, 0, TAU); g.fillStyle = lit > .5 ? C.white : rgba(C.white, .3); g.fill();
    g.restore();
  });
  g.textAlign = 'left';
  sheen(g, x0, ty - 12, 7 * tw + 6 * gap, th, 28, prog(t, 20.0, 20.6), .5);
  // hours panel
  const pk = eExpo(prog(t, 18.6, 19.1)), px = 90, pw = W - 180, py = 1080, ph = 330;
  if (pk > 0) {
    g.save(); g.translate(0, (1 - pk) * 120); g.globalAlpha *= pk;
    glass(g, px, py, pw, ph, 48, 1);
    [['Senin – Jumat', '09.00 – 21.00', 18.75], ['Sabtu – Minggu', '09.00 – 17.00', 19.0]].forEach(([d, h, t0], i) => {
      const y = py + 120 + i * 140;
      font(g, 500, 46); g.fillStyle = rgba(C.white, .8); g.textAlign = 'left'; g.globalAlpha = pk * eOut(prog(t, t0, t0 + .4)); g.fillText(d, px + 60, y);
      font(g, 800, 58); g.fillStyle = C.white; g.textAlign = 'right'; g.fillText(h, px + pw - 60, y);
      if (i === 0) { g.fillStyle = rgba(C.white, .15); g.fillRect(px + 60, y + 52, pw - 120, 2); }
    });
    g.restore(); g.textAlign = 'left';

}

// ---------- S8 tagline ----------
function sceneTag(g, t) {
  const out = eIn(prog(t, 22.75, 23.0));
  g.save(); g.globalAlpha = 1 - out;
  // god rays
  g.globalCompositeOperation = 'lighter';

    const gr = g.createLinearGradient(W / 2, -100, W / 2 + Math.cos(a) * len, -100 - Math.sin(a) * len * -1);
    gr.addColorStop(0, rgba(C.cyan, .08 * eOut(prog(t, 21, 21.6)))); gr.addColorStop(1, rgba(C.cyan, 0));
    g.fillStyle = gr; g.beginPath(); g.moveTo(W / 2, -100); g.lineTo(W / 2 + Math.cos(a - .07) * len, -100 + Math.abs(Math.sin(a - .07)) * len); g.lineTo(W / 2 + Math.cos(a + .07) * len, -100 + Math.abs(Math.sin(a + .07)) * len); g.closePath(); g.fill();
  }

  g.translate(W / 2, H * .5); g.scale(push, push); g.translate(-W / 2, -H * .5);
  font(g, 300, 96, 'italic '); g.fillStyle = rgba(C.white, .85); fadeUp(g, 'Karena sehat', W / 2, 820, 96, 21.05, .03, t);
  font(g, 900, 118); g.fillStyle = C.white; fadeUp(g, 'tidak mengenal', W / 2, 960, 118, 21.35, .025, t);

// ---------- S9 logo ----------
const IMG = {}, TINT = {};
const LOCK = { k: [857, 560], sp: [857, 560], ka: [535, 1210], ph: [540, 1430], w: 1009, h: 916 };
function sceneLogo(g, t) {
  const s = W * .62 / LOCK.w, cx = W / 2, cy = 700;
  const ox = cx - (LOCK.w / 2 + 535) * s, oy = cy - (LOCK.h / 2 + 560) * s;
  const glow = g.createRadialGradient(cx, cy, 0, cx, cy, 600); glow.addColorStop(0, rgba(C.elec, .35 * eOut(prog(t, 23, 23.5)))); glow.addColorStop(1, rgba(C.elec, 0));
  g.fillStyle = glow; g.fillRect(0, 0, W, H);

    g.save(); g.beginPath(); g.moveTo(x, y + h); g.lineTo(x + d, y + h); g.lineTo(x, y + h - d); g.closePath(); g.clip(); g.drawImage(TINT.k, x, y + (1 - kk) * 30, w, h); g.restore();
  }
  const sk = eIO(prog(t, 23.15, 23.8));
  if (sk > 0) { const x = ox + LOCK.sp[0] * s, y = oy + LOCK.sp[1] * s, w = TINT.sp.width * s, h = TINT.sp.height * s; g.save(); g.beginPath(); g.rect(x - 10, y + h * (1 - sk), w + 20, h * sk + 10); g.clip(); g.drawImage(TINT.sp, x, y, w, h); g.restore(); }
  [['ka', 23.4], ['ph', 23.55]].forEach(([n, t0]) => {
    const k = eExpo(prog(t, t0, t0 + .5)); if (k <= 0) return;
    const im = TINT[n], x = ox + LOCK[n][0] * s, y = oy + LOCK[n][1] * s, w = im.width * s, h = im.height * s;
    g.save(); g.beginPath(); g.rect(x - 10, y, w + 20, h + 6); g.clip(); g.drawImage(im, x, y + (1 - k) * h, w, h); g.restore();
  });
  g.restore();
  // WhatsApp pill
  const pk = eExpo(prog(t, 23.7, 24.15)), px = 120, pw = W - 240, py = 1250, ph = 190;
  if (pk > 0) {
    g.save(); g.translate(0, (1 - pk) * 80); g.globalAlpha = pk;
    g.save(); g.shadowColor = rgba(C.elec, .7); g.shadowBlur = 50;
    const pg = g.createLinearGradient(px, py, px + pw, py + ph); pg.addColorStop(0, C.elec); pg.addColorStop(1, '#0f5fd6');
    rr(g, px, py, pw, ph, 95); g.fillStyle = pg; g.fill(); g.restore();
    font(g, 500, 38); g.fillStyle = rgba(C.white, .85); g.textAlign = 'center'; g.fillText('Booking via WhatsApp', W / 2, py + 72);
    font(g, 900, 70); g.fillStyle = C.white; g.fillText('0812-3333-9435', W / 2, py + 148);
    sheen(g, px, py, pw, ph, 95, prog(t, 24.2, 24.8), .45);
    g.restore();
  }
  g.textAlign = 'left';
  font(g, 700, 50); g.fillStyle = C.white; maskUp(g, 'kaffahphysio.id', W / 2, 1530, 50, 24.0, .012, t);
  font(g, 500, 34); g.fillStyle = rgba(C.light, .85); maskUp(g, 'Jl. Telindung, Batu Ampar, Balikpapan Utara', W / 2, 1595, 34, 24.15, .006, t);
}

// ---------- frame ----------
const SCENES = [[0, 4, sceneHook], [4, 6, sceneWait], [6, 12, sceneServices], [12, 14, sceneHome], [14, 16.5, sceneWhy], [16.5, 17.5, sceneWhen], [17.5, 21, sceneOpen], [21, 23, sceneTag], [23, 25, sceneLogo]];
const CUTS = [4, 6, 12, 14, 16.5, 17.5, 21, 23];
function render(t) {
  t = clamp(t, 0, DUR - 1e-6);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.filter = 'none';
  if (t >= 2.75) aurora(ctx, t, t > 21 && t < 23 ? 1.3 : 1);
  for (const [a, b, f] of SCENES) if (t >= a - .02 && t < b + .02) { ctx.save(); f(ctx, t); ctx.restore(); }
  if (t >= 2.75) dust(ctx, t, .8);
  // cut flashes
  CUTS.forEach(c => {
    const k = 1 - Math.abs(t - c) / .12; if (k <= 0) return;
    const fg = ctx.createRadialGradient(W / 2, H / 2, 0, W / 2, H / 2, H * .7);
    fg.addColorStop(0, `rgba(190,230,255,${.45 * k})`); fg.addColorStop(1, `rgba(63,160,255,${.12 * k})`);
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H); ctx.globalCompositeOperation = 'source-over';
  });
  vignette(ctx);
}

function loadImg(n) { return new Promise(r => { const i = new Image(); i.onload = () => { IMG[n] = i; r(); }; i.src = `../hero-video/assets/${n}.png`; }); }
function tint(img, a, b) {
  const c = document.createElement('canvas'); c.width = img.width; c.height = img.height;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, c.height, c.width, 0);
  gr.addColorStop(0, a); gr.addColorStop(1, b); g.fillStyle = gr; g.fillRect(0, 0, c.width, c.height);
  g.globalCompositeOperation = 'destination-in'; g.drawImage(img, 0, 0); return c;
}
async function init() {
  await Promise.all(['mark-k', 'mark-spine', 'word-kaffah', 'word-physio'].map(loadImg));
  await Promise.all(['900', '800', '700', '600', '500', '300', 'italic 300'].map(w => document.fonts.load(`${w} 100px "Inter Display"`)));
  TINT.k = tint(IMG['mark-k'], '#1f8fff', '#5fe0ff');
  TINT.sp = tint(IMG['mark-spine'], '#ffffff', '#cfe7ff');
  TINT.ka = tint(IMG['word-kaffah'], '#ffffff', '#e2f0ff');
  TINT.ph = tint(IMG['word-physio'], '#9fd0ff', '#bfe2ff');
  window.render = render; window.ready = true;
  if (Q.get('preview')) { const t0 = performance.now(); const loop = () => { render(((performance.now() - t0) / 1000) % DUR); requestAnimationFrame(loop); }; loop(); }
  else if (Q.get('t')) render(+Q.get('t'));
}
init();
