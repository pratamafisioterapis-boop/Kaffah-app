<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Laporan Perkembangan Anak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: dua tampilan dari data yang sama. Portal = layar ponsel orang tua dengan tab bawah. PDF = lembar kertas putih yang selalu terang. */
:root{
  --bg:#eef3f7; --surface:#ffffff; --ink:#14263a; --muted:#5b6b7c; --line:#dde5ec; --soft:#eaf0f5;
  --brand:#044687; --brand-ink:#fff;
  --pt:#1d62c9; --pt-soft:#e3eefc; --ot:#b5530f; --ot-soft:#fcebdc; --st:#0b7d5e; --st-soft:#dcf4ea;
  --warn:#9a6700; --warn-soft:#fff3d1;
  --paper:#ffffff; --paper-ink:#1b2a3a; --paper-muted:#64748b; --paper-line:#e2e8f0;
  --font:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1620; --surface:#15222f; --ink:#e6eef6; --muted:#93a4b6; --line:#27394a; --soft:#1c2c3b;
  --brand:#5aa8ee; --brand-ink:#08213a;
  --pt:#6aa5f5; --pt-soft:#14304f; --ot:#f0a06a; --ot-soft:#3d2614; --st:#4ed0a2; --st-soft:#113a2e;
  --warn:#f0c14b; --warn-soft:#3a2f10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1620; --surface:#15222f; --ink:#e6eef6; --muted:#93a4b6; --line:#27394a; --soft:#1c2c3b;
  --brand:#5aa8ee; --brand-ink:#08213a;
  --pt:#6aa5f5; --pt-soft:#14304f; --ot:#f0a06a; --ot-soft:#3d2614; --st:#4ed0a2; --st-soft:#113a2e;
  --warn:#f0c14b; --warn-soft:#3a2f10; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.55;
  padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4,p,ul{margin:0}
ul{padding:0;list-style:none}
.wrap{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.demo{background:var(--warn-soft);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:12.5px}
.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;align-self:center;max-width:100%}
.seg button{font:inherit;font-weight:700;font-size:13px;border:0;background:none;color:var(--muted);padding:8px 16px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(0,0,0,.12)}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* ---------- Portal ---------- */
.phone{width:100%;max-width:430px;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;display:flex;flex-direction:column}
.p-top{background:var(--brand);color:var(--brand-ink);padding:18px 18px 16px;display:flex;flex-direction:column;gap:2px}
.p-top small{opacity:.85;font-size:12px;letter-spacing:.02em}
.p-top h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
.p-top .meta{font-size:12.5px;opacity:.9}
.p-body{padding:16px 18px 20px;display:flex;flex-direction:column;gap:16px;min-height:520px}
.tabs{display:flex;border-top:1px solid var(--line);background:var(--surface)}
.tabs button{flex:1;font:inherit;font-size:12px;font-weight:700;background:none;border:0;border-top:3px solid transparent;padding:10px 4px 12px;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{color:var(--brand);border-top-color:var(--brand)}
.lead{font-size:15px;line-height:1.6}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--soft);color:var(--muted);width:fit-content}
.stat-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--soft);border-radius:12px;padding:10px 10px 9px;display:flex;flex-direction:column;gap:0;min-width:0}
.stat b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.2}
.stat span{font-size:11.5px;color:var(--muted)}
.h{font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.dtag{font-size:11px;font-weight:800;padding:2px 9px;border-radius:99px;color:var(--c);background:var(--cs)}
.goal{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0}
.goal .t{font-weight:600;font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c);border-radius:99px}
.gl{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.gl b{color:var(--ink);font-variant-numeric:tabular-nums}
.st-pill{font-size:11.5px;font-weight:700;color:var(--c)}
.dh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dh h3{font-size:15px;font-weight:800}
.dh span.who{font-size:12px;color:var(--muted)}
.chart{display:flex;flex-direction:column;gap:6px}
.chart svg{width:100%;height:auto;display:block}
.chart .cap{font-size:12px;color:var(--muted)}
.home li{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}
.home li:first-child{border-top:0}
.home .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.home .tx b{font-size:14px}
.home .tx span{font-size:12.5px;color:var(--muted)}
.days{display:flex;gap:3px;margin-top:3px}
.days i{width:18px;height:18px;border-radius:5px;background:var(--soft);font-style:normal;font-size:10px;display:grid;place-items:center;color:var(--muted)}
.days i.on{background:var(--c);color:#fff}
.vid{font:inherit;font-size:12px;font-weight:700;color:var(--c);background:var(--cs);border:0;border-radius:8px;padding:6px 10px;cursor:pointer;white-space:nowrap}
.notes textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;min-height:90px;resize:vertical}
.btn{font:inherit;font-weight:700;font-size:13px;border-radius:10px;padding:10px 14px;border:0;background:var(--brand);color:var(--brand-ink);cursor:pointer}
.btn.ghost{background:var(--soft);color:var(--ink)}
.msg{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:2px}
.msg small{color:var(--muted);font-size:11.5px}
.msg.me{background:var(--cs,var(--soft))}
.pdfbtn{display:flex;gap:8px;flex-wrap:wrap}

/* ---------- PDF ---------- */
.paper{background:var(--paper);color:var(--paper-ink);width:100%;max-width:794px;margin:0 auto;border-radius:4px;box-shadow:0 2px 14px rgba(0,0,0,.18);padding:clamp(18px,5vw,44px);display:flex;flex-direction:column;gap:18px;font-size:13px}
.paper h1,.paper h2,.paper h3{color:var(--paper-ink)}
.lh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:3px solid #044687;padding-bottom:12px}
.lh .logo{font-weight:800;font-size:16px;color:#044687}
.lh .logo small{display:block;font-weight:500;font-size:11px;color:var(--paper-muted)}
.lh .ttl{text-align:right}
.lh .ttl h1{font-size:18px;font-weight:800;color:#044687}
.lh .ttl span{font-size:11.5px;color:var(--paper-muted)}
.idg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px;background:#f3f7fb;border-radius:6px;padding:10px 12px}
.idg div{display:flex;flex-direction:column;font-size:11px;color:var(--paper-muted)}
.idg b{font-size:12.5px;color:var(--paper-ink);font-weight:700}
.paper h2{font-size:13.5px;font-weight:800;color:#044687;border-bottom:1px solid var(--paper-line);padding-bottom:4px;margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
.paper p{line-height:1.6}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px;font-size:12px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--paper-line);vertical-align:top}
th{background:#f3f7fb;font-weight:700;color:#044687;font-size:11px}
td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pbar{width:90px;height:7px;background:#e8eef4;border-radius:9px;overflow:hidden;display:inline-block;vertical-align:middle;margin-right:6px}
.pbar i{display:block;height:100%}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.paper .chart .cap{color:var(--paper-muted)}
.sign{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:6px}
.sign div{min-width:180px;display:flex;flex-direction:column;gap:2px;font-size:12px}
.sign .ln{border-bottom:1px solid var(--paper-ink);height:42px;margin-bottom:2px;display:flex;align-items:flex-end;font-style:italic;color:var(--paper-muted)}
.gloss dt{font-weight:700;display:inline}
.gloss dd{display:inline;margin:0}
.gloss div{margin-bottom:3px}
.small{font-size:11px;color:var(--paper-muted)}
</style>
<style>html{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<div class="wrap">
  <div class="demo">Contoh tampilan. Nama anak, angka, dan tanda tangan fiktif. Isi laporan di aplikasi nyata berasal dari SOAP, sasaran, dan hasil tes yang dimasukkan terapis, lalu disetujui koordinator sebelum terbit.</div>
  <div class="seg" role="group" aria-label="Pilih tampilan">
    <button type="button" id="vp" aria-pressed="true">Portal orang tua</button>
    <button type="button" id="vd" aria-pressed="false">Versi PDF</button>
  </div>
  <div id="portal"></div>
  <div id="pdf" hidden></div>
</div>

<script>
(function(){
const $=s=>document.querySelector(s);
const C={pt:{n:'Fisioterapi',w:'Ft. Rina, S.Ft',c:'--pt',cs:'--pt-soft'},ot:{n:'Terapi Okupasi',w:'Ot. Dina, S.Tr.OT',c:'--ot',cs:'--ot-soft'},st:{n:'Terapi Wicara',w:'Wc. Fitri, S.Tr.Wic',c:'--st',cs:'--st-soft'}};
const R={
 child:'Aisyah R.',rm:'RM-0412',age:'4 tahun 10 bulan',dob:'14 Jan 2022',dx:'Cerebral palsy spastik diplegi, keterlambatan bahasa',
 period:'27 Okt - 25 Nov 2026',issued:'25 Nov 2026',parent:'Ibu Rahma',
 att:{pt:[8,8],ot:[7,8],st:[3,4]},
 summary:'Dalam sebulan terakhir Aisyah menunjukkan kemajuan yang jelas. Ia mulai berjalan lebih jauh dengan tumit menapak, naik tangga dengan pegangan, dan makan dengan sendok lebih rapi. Kemampuan berbicaranya juga meningkat: ia sudah menyusun dua sampai tiga kata. Kami akan terus melatih keseimbangan, kemandirian makan dan berpakaian, serta kejelasan bicara.',
 goals:[
  {d:'pt',t:'Berjalan tanpa alat bantu dengan tumit menapak',from:8,now:20,to:50,u:' m'},
  {d:'pt',t:'Naik tangga bergantian kaki',from:1,now:3,to:5,u:' anak tangga'},
  {d:'pt',t:'Keseimbangan berdiri (skor PBS)',from:30,now:38,to:46,u:''},
  {d:'ot',t:'Makan sendiri dengan sendok, suapan tidak tumpah',from:20,now:45,to:80,u:'%'},
  {d:'ot',t:'Memakai kaus tanpa bantuan fisik',from:5,now:3,to:1,u:'',lvl:['mandiri','pengawasan','bantuan sedikit','bantuan sedang','bantuan penuh']},
  {d:'ot',t:'Duduk tenang saat mewarnai',from:3,now:6,to:10,u:' menit'},
  {d:'st',t:'Menyusun kalimat 3-4 kata',from:1.4,now:2.1,to:2.8,u:' kata'},
  {d:'st',t:'Bunyi bicara benar (PCC)',from:48,now:62,to:70,u:'%'},
  {d:'st',t:'Minum dari gelas tanpa tersedak',from:4,now:7,to:9,u:' dari 10'}],
 trends:[
  {id:'gm',d:'pt',t:'Kemampuan motorik kasar (GMFM-88)',pts:[['10 Sep',68.4],['14 Okt',72.0],['11 Nov',74.2],['25 Nov',76.8]],min:60,max:85,unit:'%'},
  {id:'pl',d:'st',t:'Bahasa ekspresif (PLS-5)',pts:[['10 Sep',60],['14 Okt',63],['11 Nov',66],['25 Nov',71]],min:50,max:120,unit:'',band:[85,115],bandL:'Rentang rata-rata anak seusia'}],
 home:[
  {d:'pt',t:'Peregangan betis',h:'3 x 30 detik tiap kaki, 2 kali sehari',on:5,v:true},
  {d:'pt',t:'Berdiri satu kaki sambil berpegangan',h:'10 detik tiap kaki, 5 kali',on:4,v:true},
  {d:'ot',t:'Rutinitas sensori pagi',h:'Tekanan dalam dan permainan tekstur, 10 menit',on:6,v:false},
  {d:'ot',t:'Menyendok biji-bijian',h:'Dari mangkuk ke mangkuk, 5 menit',on:5,v:true},
  {d:'st',t:'Baca buku bergambar',h:'10 menit, minta Aisyah menunjuk dan menyebut',on:6,v:false},
  {d:'st',t:'Beri pilihan dua kata',h:'"Susu atau air?" sebelum menolong',on:7,v:false}],
 rec:['Lanjutkan fisioterapi dan terapi okupasi 2 kali per minggu, terapi wicara 1 kali per minggu.',
  'Pertimbangkan kontrol ke dokter rehabilitasi medik untuk meninjau kebutuhan ortosis (AFO) karena pertumbuhan.',
  'Bagikan saran kelas untuk guru TK: tempat duduk yang stabil, waktu mewarnai dipecah menjadi sesi pendek, kaus tanpa label.',
  'Evaluasi ulang menyeluruh pada sesi ke-12 berikutnya.'],
 gloss:[['GMFM-88','tes kemampuan gerak besar seperti duduk, berdiri, dan berjalan. Nilai makin tinggi makin baik.'],
  ['PLS-5','tes bahasa anak. Nilai 100 adalah rata-rata anak seusia.'],
  ['PCC','persentase bunyi konsonan yang diucapkan benar.'],
  ['PBS','tes keseimbangan, nilai tertinggi 56.'],
  ['Spastisitas','otot yang kaku dan tegang saat digerakkan.'],
  ['Sensori','cara tubuh menerima dan menanggapi sentuhan, suara, dan gerakan.']]
};
const pct=g=>Math.max(0,Math.min(100,Math.round((g.now-g.from)/(g.to-g.from)*100)));
const word=p=>p>=65?'Hampir tercapai':p>=35?'Berkembang':'Mulai terlihat';
const fmt=(g,v)=>g.lvl?g.lvl[v-1]:(String(v).replace('.',',')+g.u);

function chart(t,w){
 const W=360,H=150,L=34,Rr=14,T=14,B=26;const x=i=>L+i*(W-L-Rr)/(t.pts.length-1);const y=v=>T+(1-(v-t.min)/(t.max-t.min))*(H-T-B);
 const col=`var(${C[t.d].c})`;
 let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t.t}">`;
 const ticks=[t.min,Math.round((t.min+t.max)/2),t.max];
 ticks.forEach(v=>{s+=`<line x1="${L}" x2="${W-Rr}" y1="${y(v)}" y2="${y(v)}" stroke="${w?'#e2e8f0':'var(--line)'}" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="10" fill="${w?'#64748b':'var(--muted)'}">${v}</text>`});
 if(t.band){s+=`<rect x="${L}" y="${y(Math.min(t.band[1],t.max))}" width="${W-L-Rr}" height="${y(t.band[0])-y(Math.min(t.band[1],t.max))}" fill="${col}" opacity=".10"/><text x="${L+6}" y="${y(t.band[0])-5}" font-size="9.5" fill="${w?'#64748b':'var(--muted)'}">${t.bandL}</text>`}
 const d=t.pts.map((p,i)=>`${i?'L':'M'}${x(i)},${y(p[1])}`).join(' ');
 s+=`<path d="${d}" fill="none" stroke="${col}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
 t.pts.forEach((p,i)=>{const last=i===t.pts.length-1;
  s+=`<circle cx="${x(i)}" cy="${y(p[1])}" r="${last?5:3.5}" fill="${last?col:(w?'#fff':'var(--surface)')}" stroke="${col}" stroke-width="2"/>`;
  s+=`<text x="${x(i)}" y="${y(p[1])-9}" text-anchor="${i===0?'start':last?'end':'middle'}" font-size="10.5" font-weight="${last?800:600}" fill="${w?'#1b2a3a':'var(--ink)'}">${String(p[1]).replace('.',',')}${t.unit}</text>`;
  s+=`<text x="${x(i)}" y="${H-8}" text-anchor="${i===0?'start':last?'end':'middle'}" font-size="10" fill="${w?'#64748b':'var(--muted)'}">${p[0]}</text>`});
 return s+'</svg>';
}
const tot=Object.values(R.att).reduce((a,b)=>[a[0]+b[0],a[1]+b[1]],[0,0]);
const style=d=>`style="--c:var(${C[d].c});--cs:var(${C[d].cs})"`;

/* ---------- Portal ---------- */
const TABS=['Ringkasan','Sasaran','Program rumah','Catatan'];let tab=0;const msgs=[{me:false,who:'Ft. Rina',t:'Bu Rahma, Aisyah hebat minggu ini. Jangan lupa peregangan malam ya.',d:'23 Nov, 16:10'},{me:true,who:'Anda',t:'Terima kasih Bu. Malam ini Aisyah menolak peregangan, boleh diganti permainan?',d:'23 Nov, 19:42'}];
function pTab(){
 if(tab===0)return `
 <span class="badge">Laporan periode ${R.period}</span>
 <p class="lead">${R.summary}</p>
 <div class="stat-row"><div class="stat"><b>${tot[0]}/${tot[1]}</b><span>sesi dihadiri</span></div><div class="stat"><b>${R.goals.filter(g=>pct(g)>=65).length}/${R.goals.length}</b><span>sasaran hampir tercapai</span></div><div class="stat"><b>${R.home.reduce((a,h)=>a+h.on,0)}</b><span>latihan rumah tercatat</span></div></div>
 <div class="h">Perjalanan Aisyah</div>
 ${R.trends.map(t=>`<div class="chart" ${style(t.d)}><div class="dh"><span class="dtag">${C[t.d].n}</span><b style="font-size:13.5px">${t.t}</b></div>${chart(t,false)}</div>`).join('')}
 <div class="h">Tim terapis</div>
 <ul>${Object.keys(C).map(k=>`<li style="display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:13px" ${style(k)}><span class="dtag">${C[k].n}</span><span>${C[k].w} · ${R.att[k][0]}/${R.att[k][1]} sesi</span></li>`).join('')}</ul>
 <div class="pdfbtn"><button type="button" class="btn" data-view="pdf">Lihat versi PDF</button></div>`;
 if(tab===1)return Object.keys(C).map(k=>`<div ${style(k)}><div class="dh"><span class="dtag">${C[k].n}</span><span class="who">${C[k].w}</span></div>
  ${R.goals.filter(g=>g.d===k).map(g=>{const p=pct(g);return `<div class="goal"><span class="t">${g.t}</span><div class="bar" role="img" aria-label="${p} persen menuju target"><i style="width:${p}%"></i></div><div class="gl"><span>Awal <b>${fmt(g,g.from)}</b></span><span>Sekarang <b>${fmt(g,g.now)}</b></span><span>Target <b>${fmt(g,g.to)}</b></span></div><span class="st-pill">${word(p)} · ${p}%</span></div>`}).join('')}</div>`).join('');
 if(tab===2)return `<p class="hint" style="font-size:13px;color:var(--muted)">Latihan 7 hari terakhir. Ketuk kotak hari ini untuk menandai sudah dilakukan.</p><ul class="home">${R.home.map((h,i)=>`<li ${style(h.d)}><div class="tx"><span class="dtag" style="width:fit-content">${C[h.d].n}</span><b>${h.t}</b><span>${h.h}</span><div class="days" data-h="${i}">${[0,1,2,3,4,5,6].map(j=>`<i class="${j<h.on?'on':''}">${['S','S','R','K','J','S','M'][j]}</i>`).join('')}</div></div>${h.v?`<button type="button" class="vid">Putar video</button>`:''}</li>`).join('')}</ul>`;
 return `<div class="notes"><p style="font-size:13px;color:var(--muted)">Tulis pengamatan atau pertanyaan untuk terapis. Pesan masuk ke kotak masuk terapis.</p>
 <div style="display:flex;flex-direction:column;gap:8px;margin:12px 0" id="msgs">${msgs.map(m=>`<div class="msg ${m.me?'me':''}"><small>${m.who} · ${m.d}</small>${m.t}</div>`).join('')}</div>
 <textarea id="nt" placeholder="Contoh: Aisyah minum dari gelas tanpa tersedak 3 kali hari ini" aria-label="Catatan untuk terapis"></textarea>
 <div style="margin-top:8px"><button type="button" class="btn" id="send">Kirim ke terapis</button></div></div>`;
}
function renderPortal(){
 $('#portal').innerHTML=`<div class="phone"><div class="p-top"><small>Portal Clinara · Klinik Tumbuh Kembang (contoh)</small><h1>${R.child}</h1><span class="meta">${R.age} · Laporan terbit ${R.issued}</span></div>
 <div class="p-body">${pTab()}</div>
 <div class="tabs" role="tablist">${TABS.map((t,i)=>`<button type="button" role="tab" aria-selected="${tab===i}" data-tab="${i}">${t}</button>`).join('')}</div></div>`;
}

/* ---------- PDF ---------- */
function renderPdf(){
 const rows=R.goals.map(g=>{const p=pct(g);const col=`var(${C[g.d].c})`;return `<tr><td>${C[g.d].n}</td><td>${g.t}</td><td class="num">${fmt(g,g.from)}</td><td class="num"><b>${fmt(g,g.now)}</b></td><td class="num">${fmt(g,g.to)}</td><td class="num"><span class="pbar"><i style="width:${p}%;background:${col}"></i></span>${p}%</td></tr>`}).join('');
 $('#pdf').innerHTML=`<div class="paper">
  <div class="lh"><div class="logo">Klinik Tumbuh Kembang<small>Fisioterapi · Terapi Okupasi · Terapi Wicara (nama contoh)</small></div><div class="ttl"><h1>Laporan Perkembangan Anak</h1><span>Periode ${R.period} · Terbit ${R.issued}</span></div></div>
  <div class="idg"><div>Nama anak<b>${R.child}</b></div><div>No. RM<b>${R.rm}</b></div><div>Tanggal lahir · usia<b>${R.dob} · ${R.age}</b></div><div>Orang tua<b>${R.parent}</b></div><div style="grid-column:1/-1">Diagnosis medis<b>${R.dx}</b></div><div>Kehadiran<b>${tot[0]} dari ${tot[1]} sesi</b></div><div>Koordinator kasus<b>Ft. Rina, S.Ft</b></div></div>
  <section><h2>Ringkasan untuk orang tua</h2><p>${R.summary}</p></section>
  <section><h2>Kemajuan terhadap sasaran</h2><div class="tw"><table><thead><tr><th>Terapi</th><th>Sasaran</th><th>Awal</th><th>Sekarang</th><th>Target</th><th>Capaian</th></tr></thead><tbody>${rows}</tbody></table></div></section>
  <section><h2>Hasil tes berulang</h2><div class="two">${R.trends.map(t=>`<div class="chart"><b style="font-size:12.5px">${t.t}</b>${chart(t,true)}<span class="cap">${C[t.d].n} · ${C[t.d].w}</span></div>`).join('')}</div></section>
  <section><h2>Temuan per terapi</h2>
   <p><b>Fisioterapi.</b> GMFCS level II. Skor motorik kasar naik dari 74,2% menjadi 76,8%, terutama pada berdiri dan berjalan. Kekakuan otot betis berkurang dan sudut dorsifleksi pergelangan kaki membaik. Keseimbangan naik dari 34 menjadi 38 dari 56.</p>
   <p style="margin-top:6px"><b>Terapi Okupasi.</b> Aisyah lebih peka terhadap sentuhan dan tekstur dibanding kebanyakan anak, sehingga memengaruhi makan, berpakaian, dan duduk di kelas. Kemampuan makan sendiri meningkat (penilaian orang tua 3 menjadi 5 dari 10, perubahan bermakna). Berpakaian masih butuh bantuan sedang.</p>
   <p style="margin-top:6px"><b>Terapi Wicara.</b> Pemahaman bahasa mendekati rentang rata-rata, kemampuan berbicara masih tertinggal. Rata-rata panjang kalimat naik dari 1,7 menjadi 2,1 kata. Bunyi bicara benar naik dari 55% menjadi 62%. Aisyah makan secara oral penuh, minum cepat masih kadang tersedak.</p></section>
  <section><h2>Program rumah periode berikutnya</h2><div class="tw"><table><thead><tr><th>Terapi</th><th>Kegiatan</th><th>Cara dan frekuensi</th><th>Dilakukan (7 hari)</th></tr></thead><tbody>${R.home.map(h=>`<tr><td>${C[h.d].n}</td><td>${h.t}</td><td>${h.h}</td><td class="num">${h.on} dari 7</td></tr>`).join('')}</tbody></table></div></section>
  <section><h2>Rencana dan rekomendasi</h2><ul style="display:flex;flex-direction:column;gap:4px">${R.rec.map(r=>`<li>- ${r}</li>`).join('')}</ul></section>
  <section><h2>Arti istilah</h2><dl class="gloss" style="margin:0">${R.gloss.map(g=>`<div><dt>${g[0]}</dt> <dd>: ${g[1]}</dd></div>`).join('')}</dl></section>
  <div class="sign"><div><span class="ln">tanda tangan</span><b>Ft. Rina, S.Ft</b>Koordinator kasus · STR/SIP xxxxxx</div><div><span class="ln">tanda tangan</span><b>${R.parent}</b>Orang tua / wali</div></div>
  <p class="small">Laporan ini berisi data kesehatan anak dan hanya untuk orang tua/wali. Jangan dibagikan tanpa persetujuan. Hasil tes menggambarkan kondisi saat pemeriksaan dan dapat berubah.</p>
 </div>`;
}

function view(v){$('#portal').hidden=v!=='portal';$('#pdf').hidden=v!=='pdf';$('#vp').setAttribute('aria-pressed',v==='portal');$('#vd').setAttribute('aria-pressed',v==='pdf');window.scrollTo({top:0})}
document.addEventListener('click',e=>{
 const t=e.target.closest('button');if(!t)return;
 if(t.id==='vp')view('portal');else if(t.id==='vd')view('pdf');
 else if(t.dataset.view)view(t.dataset.view);
 else if(t.dataset.tab){tab=+t.dataset.tab;renderPortal();}
 else if(t.id==='send'){const v=$('#nt').value.trim();if(!v)return;msgs.push({me:true,who:'Anda',t:v.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])),d:'Baru saja'});renderPortal();}
 else if(t.classList.contains('vid')){t.textContent='Contoh: video tidak tersedia';}
});
document.addEventListener('click',e=>{
 const i=e.target.closest('.days i');if(!i)return;const h=R.home[+i.parentNode.dataset.h];
 const idx=[...i.parentNode.children].indexOf(i);if(idx!==6)return;i.classList.toggle('on');
});
renderPortal();renderPdf();
})();
</script>
</body>
</html>
