# Deploy manual fungsi WhatsApp AI ke Supabase (tombol "Run workflow" di tab Actions, bisa dari HP).
# Butuh secret repo SUPABASE_ACCESS_TOKEN (token pribadi Supabase). Tidak berjalan otomatis.
name: Deploy WA functions

on:
  workflow_dispatch:
    inputs:
      functions:
        description: "Fungsi yang di-deploy (pisahkan spasi)"
        required: true
        default: "wa-ai-reply wa-watzap-webhook"

concurrency:
  group: deploy-wa-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          FUNCTIONS: ${{ inputs.functions }}
        run: |
          set -euo pipefail
          for fn in $FUNCTIONS; do
            case "$fn" in
              wa-ai-reply|wa-watzap-webhook) ;;
              *) echo "Fungsi tidak diizinkan: $fn"; exit 1 ;;
            esac
            supabase functions deploy "$fn" --no-verify-jwt --use-api --yes --project-ref dqkejdamagvlhqvxaqej
          done
