<!doctype html>
<html lang="en">
  <head>
  <meta charset="UTF-8" />
  <script>
    // Runs synchronously during HTML parsing, before the static Kaffah tags
    // below are reached, so it wins the browser's "first <title>/<link
    // rel=icon> in the document" precedence - no flash, and it works
    // regardless of edge/CDN routing quirks (unlike relying solely on a
    // host-based rewrite to serve a different static HTML file). Kept
    // deliberately dependency-free and inline since it must run before any
    // other script. tools/generate-clinara-shell.js still produces a
    // Clinara-branded index-clinara.html for clinara.id at the HTTP layer
    // (helps non-JS clients like social-share crawlers); this is the
    // belt-and-suspenders fix for real browsers.
    (function () {
      var h = window.location.hostname;
      if (h !== 'clinara.id' && h !== 'www.clinara.id') return;
      var icon = '/clinara-icon.png';
      var appIcon = '/clinara-icon-app.png';
      document.write('<link rel="icon" type="image/png" href="' + icon + '">');
      document.write('<meta name="theme-color" content="#0f2a4a">');
      document.write('<link rel="manifest" href="/manifest-clinara.json">');
      document.write('<meta name="apple-mobile-web-app-title" content="Clinara">');
      document.write('<link rel="apple-touch-icon" href="' + appIcon + '">');
      document.write('<title>Clinara — Better Care. Smarter Management.</title>');
      document.write('<meta name="description" content="Clinara adalah Healthcare Management Platform yang membantu klinik dan pusat terapi mengelola pasien, tenaga kesehatan, jadwal, layanan, komunikasi, dan data dalam satu sistem terintegrasi.">');
      document.write('<meta property="og:site_name" content="Clinara">');
      document.write('<meta property="og:url" content="https://clinara.id/">');
      document.write('<meta property="og:title" content="Clinara — Better Care. Smarter Management.">');
      document.write('<meta property="og:description" content="Platform manajemen layanan kesehatan untuk klinik dan pusat terapi.">');
      document.write('<meta property="og:image" content="https://clinara.id/clinara-icon-app.png">');
      document.write('<meta name="twitter:image" content="https://clinara.id/clinara-icon-app.png">');
    })();
  </script>
